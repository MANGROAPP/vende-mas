  const totalRejected = saleRej.reduce((s, r) => s + r.totalAmount, 0);
  const net = sale.grossTotal - totalRejected;
  const disponible = saldoDisponible(sale.id);
  const rate = rejectionRate(sale.grossTotal, totalRejected);
  const canModify = sale.status !== "anulada" && sale.status !== "cerrada";

  return `
    <div class="page-head">
      <div><h1 class="page-title mono" style="font-size:22px;">${sale.correlative}</h1><p class="page-sub">${esc(client?.businessName)} · ${esc(branch?.name)} · ${esc(branch?.distrito)}</p></div>
      ${saleStatusPill(sale.status)}
    </div>
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr);">
      ${statCard({ label: "Venta original", value: currency(sale.grossTotal), accent: "purple", icon: "receipt" })}
      ${statCard({ label: "Rechazado", value: currency(totalRejected), sub: `${pct(rate)} de la venta`, accent: "red", icon: "undo" })}
      ${statCard({ label: "Venta neta", value: currency(net), accent: "green", icon: "checkCircle" })}
    </div>
    <div class="card">
      <h2 style="font-size:13px;font-weight:700;margin:0 0 12px;">Detalle por línea</h2>
      <table><thead><tr><th>Línea</th><th>Monto</th></tr></thead>
      <tbody>${sale.details.map((d) => `<tr><td>${findLine(d.lineId)?.name}</td><td>${currency(d.amount)}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <h2 style="font-size:13px;font-weight:700;margin:0;">Rechazos asociados (${saleRej.length})</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${sale.status === "registrada" ? `<button id="btn-mark-delivered" class="btn btn-outline btn-sm">${icon("package",13)} Marcar como entregada</button>` : ""}
          ${canModify ? `<button id="btn-toggle-rej" class="btn btn-danger btn-sm" ${disponible <= 0 ? "disabled" : ""}>${icon("plus",14)} Registrar rechazo</button>` : ""}
          ${canModify ? `<button id="btn-close-sale" class="btn btn-ghost btn-sm">${icon("lock",13)} Cerrar venta</button>` : ""}
        </div>
      </div>
      ${!canModify ? `<div class="saldo-info" style="margin-top:0;margin-bottom:14px;">Esta venta está <strong>${sale.status === "anulada" ? "anulada" : "cerrada"}</strong> — ya no admite rechazos ni modificaciones.</div>` : ""}
      ${disponible <= 0 && canModify ? `<p style="font-size:12px;color:var(--text-mut);margin:-4px 0 12px;">Esta venta ya no tiene saldo disponible para nuevos rechazos.</p>` : ""}
      <div id="rej-form-wrap">${opts.showRejForm ? rejectionFormHtml(disponible, opts.rejError) : ""}</div>
      <div class="table-scroll"><table><thead><tr><th>Rechazo</th><th>Fecha</th><th>Línea</th><th>Monto</th><th>Motivo</th><th>Observación</th></tr></thead>
      <tbody>${saleRej.flatMap((r) => r.details.map((d) => `<tr>
        <td class="mono">${r.correlative}</td><td>${fdate(r.rejectionDate)}</td><td>${findLine(d.lineId)?.name}</td>
        <td>${currency(d.amount)}</td><td>${esc(findReason(d.reasonId)?.name)}</td><td style="color:var(--text-mut);">${esc(d.observation) || "—"}</td>
      </tr>`)).join("") || `<tr><td colspan="6"><div class="empty-state">Sin rechazos registrados.</div></td></tr>`}</tbody></table></div>
    </div>

    ${sale.status === "anulada" ? `<div class="saldo-info over">Venta anulada. Motivo: ${esc(sale.cancelReason)}</div>` : ""}`;

function rejectionFormHtml(disponible, error) {
  return `
    <div class="card" style="background:var(--card-2);margin-bottom:16px;">
      <div class="saldo-info">Saldo disponible para rechazar: <b>${currency(disponible)}</b></div>

          <div class="field"><label>Motivo</label><select id="rj-reason">${DB.reasons.map((r) => `<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select></div>
        </div>

        <div style="display:flex;gap:8px;margin-top:14px;">

function attachVentaDetalleEvents(id) {
  let showRejForm = false, rejError = null;
  const rerender = () => { renderContentInPlace(viewVentaDetalle(id, { showRejForm, rejError })); attachVentaDetalleEvents(id); };
  $("#btn-toggle-rej")?.addEventListener("click", () => { showRejForm = !showRejForm; rerender(); });
  wireDateField("rj-date");
  $("#rj-cancel")?.addEventListener("click", () => { showRejForm = false; rerender(); });
  $("#btn-mark-delivered")?.addEventListener("click", () => {
    DB.sales.find((s) => s.id === id).status = "entregada";
    toast("Venta marcada como entregada");
    rerender();
    if (supa) supa.from("ventas").update({ estado: "entregada" }).eq("id", id).then(({ error }) => { if (error) supaToast(error, "No se pudo actualizar el estado de la venta en el servidor."); });
  });
  $("#btn-close-sale")?.addEventListener("click", () => {
    const sale = DB.sales.find((s) => s.id === id);
    sale.status = "cerrada";
    toast("Venta cerrada — ya no admite modificaciones");
    rerender();
    if (supa) supa.from("ventas").update({ estado: "cerrada" }).eq("id", id).then(({ error }) => { if (error) supaToast(error, "No se pudo cerrar la venta en el servidor."); });
  });
  $("#rej-form")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const sale = DB.sales.find((s) => s.id === id);
    const amount = parseFloat($("#rj-amount").value) || 0;
    const disponible = saldoDisponible(id);
    if (amount <= 0) return;
    if (amount > disponible) { rejError = `El importe del rechazo (${currency(amount)}) supera el saldo disponible de la venta (${currency(disponible)}).`; showRejForm = true; rerender(); return; }
    const user = currentUser();
    const dateIso = $("#rj-date").value || TODAY_ISO;
    const correlative = nextCorrelative("R", parseInt(dateIso.slice(0, 4), 10));
    const lineId = $("#rj-line").value, reasonId = $("#rj-reason").value, observation = $("#rj-obs").value || undefined;
    const localId = `rej-${Date.now()}`;
    DB.rejections.unshift({ id: localId, correlative, saleId: id, rejectionDate: dateIso, details: [{ lineId, amount, reasonId, observation }], totalAmount: amount, createdBy: user.id });
    const newDisp = disponible - amount;
    sale.status = newDisp <= 0 ? "cerrada" : "con_rechazo";
    toast(newDisp <= 0 ? "Rechazo registrado — venta cerrada (saldo agotado)" : "Rechazo registrado");
    showRejForm = false; rejError = null;
    rerender();

    if (supa) {
      // Igual que en "crear venta": se inserta en segundo plano — el trigger de la base de
      // datos valida el saldo otra vez y actualiza ventas.estado en el servidor; localmente
      // el estado ya se aplicó arriba para que la pantalla se sienta instantánea.
      (async () => {
        try {
          const { data: insertedRej, error: rejErr } = await supa.from("rechazos").insert({
            venta_id: id, fecha_rechazo: dateIso, monto_total: amount, creado_por: user.id,
          }).select("id, correlativo").single();
          if (rejErr) throw rejErr;
          const { error: detailErr } = await supa.from("detalle_rechazos").insert({
            rechazo_id: insertedRej.id, linea_id: lineUuidFromCode(lineId), motivo_id: reasonId, monto: amount, observacion: observation,
          });
          if (detailErr) throw detailErr;
          const local = DB.rejections.find((r) => r.id === localId);
          if (local) { local.id = insertedRej.id; local.correlative = insertedRej.correlativo; }
        } catch (err) {
          supaToast(err, "No se pudo guardar el rechazo en el servidor. Se mantiene visible solo en esta pantalla.");
        }
      })();
    }
  });
  $("#btn-toggle-cancel")?.addEventListener("click", () => {
    $("#cancel-wrap").innerHTML = `
      <div class="card" style="background:var(--card-2);max-width:420px;">
        <div class="field"><label>Motivo de anulación (obligatorio)</label><input id="cancel-reason" type="text" required></div>
        <div style="display:flex;gap:8px;"><button id="cancel-confirm" class="btn btn-danger">Confirmar anulación</button><button id="cancel-back" class="btn btn-outline">Volver</button></div>
      </div>`;
    $("#cancel-confirm").addEventListener("click", () => {
      const reason = $("#cancel-reason").value.trim();
      if (!reason) return;
      const sale = DB.sales.find((s) => s.id === id);
      sale.status = "anulada"; sale.cancelReason = reason;
      toast("Venta anulada");
      navigate("#/ventas");
    });
    $("#cancel-back").addEventListener("click", rerender);
  });
}

/* ============================================================
   VISTA: RECHAZOS — historial con filtros
   ============================================================ */
let rechazosFilters = { seller: "", period: "todos", from: "", to: "", q: "", line: "", reason: "" };
function rechazosRows(user) {
  const sales = scopedSales(user).filter((s) => !rechazosFilters.seller || s.sellerId === rechazosFilters.seller);
  const saleIds = new Set(sales.map((s) => s.id));
  let rows = DB.rejections.filter((r) => saleIds.has(r.saleId)).filter((r) => periodMatches(r.rejectionDate, rechazosFilters.period, rechazosFilters.from, rechazosFilters.to))
    .flatMap((r) => { const sale = DB.sales.find((s) => s.id === r.saleId); const client = findClient(sale?.clientId); const branch = saleBranch(sale); return r.details.map((d) => ({ r, sale, client, branch, d, reason: findReason(d.reasonId) })); });
  if (rechazosFilters.line) rows = rows.filter((row) => row.d.lineId === rechazosFilters.line);
  if (rechazosFilters.reason) rows = rows.filter((row) => row.reason?.id === rechazosFilters.reason);
  const q = rechazosFilters.q.trim().toLowerCase();
  if (q) rows = rows.filter((row) => row.r.correlative.toLowerCase().includes(q) || row.client?.businessName.toLowerCase().includes(q) || row.branch?.distrito?.toLowerCase().includes(q));

function viewClientes() {

  const clients = scopedClients(user);

function attachClientesEvents() {
  $("#btn-new-client")?.addEventListener("click", () => { clientFormOpen = true; visitFormOpen = false; renderRoute(); setTimeout(() => { $("#suc-add").click(); }, 0); });
  $("#cf-cancel")?.addEventListener("click", () => { clientFormOpen = false; renderRoute(); });
  $("#btn-new-visit")?.addEventListener("click", () => { visitFormOpen = true; clientFormOpen = false; renderRoute(); });
  $("#vf-cancel")?.addEventListener("click", () => { visitFormOpen = false; renderRoute(); });
  wireDateField("vf-date");
  $("#visit-form")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const user = currentUser();
    const sellerId = user.sellerId || user.id, clientId = $("#vf-client").value, date = $("#vf-date").value || TODAY_ISO, result = $("#vf-result").value;
    const localId = `v-${Date.now()}`;
    DB.visits.unshift({ id: localId, sellerId, clientId, date, result });
    visitFormOpen = false;
    toast("Visita registrada");
    renderRoute();

    if (supa) {
      (async () => {
        try {
          // public.visitas no tiene columna "resultado" — se codifica en "notas" (ver decodeVisitResult).
          const { data: inserted, error } = await supa.from("visitas").insert({
            vendedor_id: sellerId, cliente_id: clientId, fecha_visita: date, notas: encodeVisitNotes(result),
          }).select("id").single();
          if (error) throw error;
          const local = DB.visits.find((v) => v.id === localId);
          if (local) local.id = inserted.id;
        } catch (err) {
          supaToast(err, "No se pudo guardar la visita en el servidor. Se mantiene visible solo en esta pantalla.");
        }
      })();
    }
  });
  $("#flt-clientes-q")?.addEventListener("input", (e) => { clientesFilters.q = e.target.value; renderRoute(); });
  $("#suc-add")?.addEventListener("click", () => { const idx = $$(".suc-row", $("#suc-rows")).length; $("#suc-rows").insertAdjacentHTML("beforeend", sucRowHtml(idx)); wireSucRow($("#suc-rows").lastElementChild); });
  $("#client-form")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const bn = $("#cf-business").value.trim();
    if (!bn) return;
    const rows = $$(".suc-row", $("#suc-rows"));
    const branches = rows.map((row, i) => ({
      id: `b-${Date.now()}-${i}`, name: $(".suc-name", row).value.trim(), departamento: $(".suc-dep", row).value,
      provincia: $(".suc-prov", row).value, distrito: $(".suc-dist", row).value, reference: $(".suc-ref", row).value.trim(),
    })).filter((b) => b.name && b.distrito);
    if (!branches.length) { $("#client-form-error").textContent = "Agrega al menos una sucursal con nombre y distrito."; $("#client-form-error").style.display = "block"; return; }
    const user = currentUser();
    const sellerId = user.sellerId || user.id;
    const localId = `c-${Date.now()}`;
    const code = `CLI-${String(DB.clients.length + 1).padStart(3, "0")}`;
    const businessName = bn, tradeName = $("#cf-trade").value.trim() || bn, ruc = $("#cf-ruc").value.trim(), phone = $("#cf-phone").value.trim(), observations = $("#cf-obs").value.trim();
    DB.clients.unshift({ id: localId, code, businessName, tradeName, ruc, phone, observations, sellerId, branches });
    clientFormOpen = false;
    toast("Cliente registrado con sus sucursales");
    renderRoute();

    if (supa) {
      (async () => {
        try {
          const { data: insertedClient, error: clientErr } = await supa.from("clientes").insert({
            codigo: code, razon_social: businessName, nombre_comercial: tradeName, ruc, telefono: phone, vendedor_id: sellerId, observaciones: observations,
          }).select("id").single();
          if (clientErr) throw clientErr;

          const branchRows = [];
          for (const b of branches) {
            // public.sucursales exige zona_id; se busca/crea la zona a partir de dep/prov/dist (ver getOrCreateZoneId).
            const zoneId = await getOrCreateZoneId(b.departamento, b.provincia, b.distrito);
            branchRows.push({ cliente_id: insertedClient.id, zona_id: zoneId, codigo: b.id, nombre: b.name, direccion: b.address, referencia: b.reference });
          }
          const { data: insertedBranches, error: branchErr } = await supa.from("sucursales").insert(branchRows).select("id, codigo");
          if (branchErr) throw branchErr;

          const local = DB.clients.find((c) => c.id === localId);
          if (local) {
            local.id = insertedClient.id;
            // "codigo" en public.sucursales se usó temporalmente igual al id local de cada sucursal,
            // para poder correlacionar y corregir los ids locales con los reales de Supabase.
            (insertedBranches || []).forEach((row) => {
              const localBranch = local.branches.find((lb) => lb.id === row.codigo);
              if (localBranch) localBranch.id = row.id;
            });
          }
        } catch (err) {
          supaToast(err, "No se pudo guardar el cliente en el servidor. Se mantiene visible solo en esta pantalla.");
        }
      })();
    }
  });
}

function attachCuotasEvents() {

  // ---- Cuota por línea ----

  $$(".quota-amount").forEach((i) => i.addEventListener("input", refreshTotal)); refreshTotal();

    e.preventDefault();
    const changedAmounts = [];
    $$(".quota-amount").forEach((input) => {
      const lineId = input.dataset.line, amount = parseFloat(input.value) || 0;
      const existing = DB.quotas.find((q) => q.sellerId === sellerId && q.year === 2026 && q.month === 8 && q.lineId === lineId);
      if (existing) { existing.amount = amount; existing.updatedAt = TODAY_ISO; }
      else DB.quotas.push({ id: `q-${Date.now()}-${lineId}`, sellerId, year: 2026, month: 8, lineId, amount, updatedAt: TODAY_ISO });
      changedAmounts.push({ lineId, amount });
    });
    $("#quota-saved").style.display = "inline"; toast("Cuota guardada");
    setTimeout(() => $("#quota-saved")?.style && ($("#quota-saved").style.display = "none"), 2000);
    renderRoute();

    if (supa) {
      (async () => {
        try {
          const periodId = await ensurePeriodId(2026, 8, sellerId);
          const rows = changedAmounts.map((c) => ({ periodo_id: periodId, vendedor_id: sellerId, linea_id: lineUuidFromCode(c.lineId), monto: c.amount }));
          const { error } = await supa.from("cuotas").upsert(rows, { onConflict: "periodo_id,vendedor_id,linea_id" });
          if (error) throw error;
        } catch (err) {
          supaToast(err, "No se pudo guardar la cuota en el servidor. Se mantiene visible solo en esta pantalla.");
        }
      })();
    }
  });

  // ---- Calendario de días hábiles — clic para marcar/desmarcar feriado, recalcula en vivo ----
  const cfg0 = getWorkConfig(sellerId, 2026, 8);
  const workCfg = { sellerId, year: 2026, month: 8, countSaturdays: cfg0.countSaturdays, countSundays: cfg0.countSundays, holidays: [...cfg0.holidays] };
  function refreshCalendar() {
    $("#wd-calendar-wrap").innerHTML = workdaysCalendarHtml(2026, 8, workCfg, TODAY_ISO);
    bindCalendarClicks();
    const wd = computeBusinessDays(2026, 8, workCfg.countSaturdays, workCfg.holidays, TODAY_ISO, workCfg.countSundays);
    $("#wd-total").textContent = wd.totalHabiles;
    $("#wd-elapsed").textContent = wd.elapsedHabiles;
    $("#wd-remaining").textContent = wd.remainingHabiles;
  }
  function bindCalendarClicks() {
    $$(".wd-day[data-clickable='1']").forEach((cell) => {
      cell.addEventListener("click", () => {
        const iso = cell.dataset.iso;
        const idx = workCfg.holidays.indexOf(iso);
        if (idx >= 0) workCfg.holidays.splice(idx, 1); else workCfg.holidays.push(iso);
        refreshCalendar();
      });
    });
  }
  bindCalendarClicks();
  $("#wd-saturdays").addEventListener("change", (e) => { workCfg.countSaturdays = e.target.checked; refreshCalendar(); });
  $("#wd-sundays").addEventListener("change", (e) => { workCfg.countSundays = e.target.checked; refreshCalendar(); });
  $("#workdays-form").addEventListener("submit", (e) => {
    e.preventDefault();
    saveWorkConfig(workCfg);
    $("#wd-saved").style.display = "inline"; toast("Configuración de días hábiles guardada");
    setTimeout(() => $("#wd-saved")?.style && ($("#wd-saved").style.display = "none"), 2000);

    if (supa) {
      (async () => {
        try {
          const { error } = await supa.from("configuracion_dias").upsert({
            vendedor_id: workCfg.sellerId, anio: workCfg.year, mes: workCfg.month,
            contar_sabados: workCfg.countSaturdays, contar_domingos: workCfg.countSundays, feriados: workCfg.holidays,
          }, { onConflict: "vendedor_id,anio,mes" });
          if (error) throw error;
        } catch (err) {
          supaToast(err, "No se pudo guardar la configuración de días hábiles en el servidor. Se mantiene visible solo en esta pantalla.");
        }
      })();
    }
  });
}

      <input id="import-file" type="file" accept=".csv" style="font-size:13px;">
      <div id="import-preview" style="margin-top:16px;"></div>
    </div>`;
}
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length);
  if (!lines.length) return [];
  const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, ""));
  return lines.slice(1).map((line) => { const cells = line.split(",").map((c) => c.trim().replace(/^"|"$/g, "")); const obj = {}; headers.forEach((h, i) => (obj[h] = cells[i] ?? "")); return obj; });
}
function attachReportesEvents() {
  $("#exp-ventas").addEventListener("click", () => exportVentasExcel(scopedSales(currentUser())));
  $("#exp-rechazos").addEventListener("click", () => exportRechazosExcel(rechazosRows(currentUser())));
  $("#import-file").addEventListener("change", (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(String(ev.target.result));
      const existingRucs = new Set(DB.clients.map((c) => c.ruc)); const seen = new Set();
      const parsed = rows.map((r) => {
        const businessName = (r["Razón Social"] || r["Razon Social"] || r["businessName"] || "").trim();
        const tradeName = (r["Nombre Comercial"] || r["tradeName"] || "").trim();
        const ruc = (r["RUC"] || r["ruc"] || "").trim(); const phone = (r["Teléfono"] || r["phone"] || "").trim();
        const errors = [];
        if (!businessName) errors.push("Falta razón social"); if (!ruc) errors.push("Falta RUC");
        if (ruc && existingRucs.has(ruc)) errors.push("Cliente ya existe (RUC duplicado)");
        if (ruc && seen.has(ruc)) errors.push("Duplicado en el archivo"); if (ruc) seen.add(ruc);
        return { businessName, tradeName, ruc, phone, errors };
      });
      renderImportPreview(parsed);
    };
    reader.readAsText(file);
  });
}
let _importPreview = null;
function renderImportPreview(rows) {
  _importPreview = rows;
  $("#import-preview").innerHTML = `
    <div class="table-scroll"><table><thead><tr><th>Razón social</th><th>RUC</th><th>Teléfono</th><th>Estado</th></tr></thead>
    <tbody>${rows.map((r) => `<tr><td>${esc(r.businessName) || "—"}</td><td>${esc(r.ruc) || "—"}</td><td>${esc(r.phone) || "—"}</td>
      <td>${r.errors.length === 0 ? `<span class="badge green">Lista para importar</span>` : `<span class="badge red">${esc(r.errors.join(" · "))}</span>`}</td></tr>`).join("")}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="import-confirm" class="btn btn-purple" ${rows.every((r) => r.errors.length > 0) ? "disabled" : ""}>Confirmar importación (${rows.filter((r) => r.errors.length === 0).length} de ${rows.length})</button>
      <button id="import-cancel" class="btn btn-outline">Cancelar</button>
    </div>`;
  $("#import-confirm")?.addEventListener("click", () => {
    const user = currentUser(); let count = 0;
    _importPreview.filter((r) => r.errors.length === 0).forEach((r) => {
      DB.clients.unshift({ id: `c-${Date.now()}-${count}`, code: `CLI-${String(DB.clients.length + 1).padStart(3, "0")}`, businessName: r.businessName, tradeName: r.tradeName || r.businessName, ruc: r.ruc, phone: r.phone, sellerId: user.sellerId || user.id, branches: [] });
      count++;
    });
    $("#import-preview").innerHTML = `<div class="form-success">Se importaron ${count} cliente(s) correctamente (solo en esta demo). Recuerda agregarles sucursales desde el módulo Clientes.</div>`;
    $("#import-file").value = "";
  });
  $("#import-cancel")?.addEventListener("click", () => { $("#import-preview").innerHTML = ""; $("#import-file").value = ""; });
}

function attachUsuariosEvents() {
  const roleSel = $("#uf-role"), sellerWrap = $("#uf-seller-wrap"), sellerSel = $("#uf-seller"), newSellerWrap = $("#uf-newseller-wrap");
  function refreshSellerVisibility() {
    const needsSeller = roleSel.value !== "admin";
    sellerWrap.style.display = needsSeller ? "block" : "none";
    newSellerWrap.style.display = needsSeller && !sellerSel.value ? "grid" : "none";
  }
  roleSel.addEventListener("change", refreshSellerVisibility);
  sellerSel.addEventListener("change", refreshSellerVisibility);
  refreshSellerVisibility();

  $("#user-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = $("#user-form-error"); errEl.style.display = "none";
    const name = $("#uf-name").value.trim(), email = $("#uf-email").value.trim().toLowerCase(), pass = $("#uf-pass").value;
    const role = roleSel.value;
    const useExistingSeller = role !== "admin" && sellerSel.value;
    const newSellerCode = $("#uf-seller-code").value.trim(), newSellerName = $("#uf-seller-name").value.trim();
    if (role !== "admin" && !useExistingSeller && (!newSellerCode || !newSellerName)) {
      errEl.textContent = "Completa el código y nombre del vendedor nuevo, o elige uno existente."; errEl.style.display = "block"; return;
    }
    if (DB.users.some((u) => u.email.toLowerCase() === email)) {
      errEl.textContent = "Ya existe un usuario con ese correo."; errEl.style.display = "block"; return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const savingEl = $("#user-form-saving");
    submitBtn.disabled = true; savingEl.style.display = "inline";

    try {
      let sellerId = useExistingSeller || undefined;
      let newSellerLocal = null;
      if (role !== "admin" && !useExistingSeller) {
        sellerId = `s-${Date.now()}`;
        newSellerLocal = { id: sellerId, name: newSellerName, code: newSellerCode };
      }

      if (!supa) {
        // ---- MODO DEMO: se crea solo en memoria, igual que el resto de mutaciones en demo ----
        const userId = `u-${Date.now()}`;
        if (newSellerLocal) DB.sellers.push(newSellerLocal);
        DB.users.push({ id: userId, name, email, role, sellerId: role === "admin" ? undefined : sellerId, active: true });
        toast("Usuario creado (modo demostración)");
        e.target.reset(); refreshSellerVisibility();
        renderRoute();
        return;
      }

      // ---- MODO SUPABASE: crear el usuario de autenticación con un cliente aparte ----
      const creationClient = getUserCreationClient();
      const { data: signUpData, error: signUpError } = await creationClient.auth.signUp({ email, password: pass });
      if (signUpError) throw signUpError;
      const newUserId = signUpData?.user?.id;
      if (!newUserId) throw new Error("Supabase no devolvió el id del nuevo usuario.");

      if (newSellerLocal) {
        const { data: insertedSeller, error: sellerErr } = await supa.from("vendedores")
          .insert({ codigo: newSellerLocal.code, nombre: newSellerLocal.name }).select("id").single();
        if (sellerErr) throw sellerErr;
        sellerId = insertedSeller.id;
        newSellerLocal.id = sellerId; // corrige el id local por el real de Supabase
      }

      const { error: userInsertErr } = await supa.from("usuarios").insert({
        id: newUserId, email, nombre_completo: name, rol: role,
        vendedor_id: role === "admin" ? null : sellerId, estado: "activo",
      });
      if (userInsertErr) throw userInsertErr;

      if (newSellerLocal) DB.sellers.push(newSellerLocal);
      DB.users.push({ id: newUserId, name, email, role, sellerId: role === "admin" ? undefined : sellerId, active: true });
      toast("Usuario creado. Debe confirmar su correo antes de poder iniciar sesión.");
      e.target.reset(); refreshSellerVisibility();
      renderRoute();
    } catch (err) {
      console.error(err);
      errEl.textContent = err?.message || "No se pudo crear el usuario. Verifica los datos e intenta de nuevo.";
      errEl.style.display = "block";
    } finally {
      submitBtn.disabled = false; savingEl.style.display = "none";
    }
  });

  $$(".toggle-active").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const u = DB.users.find((uu) => uu.id === id);
      if (!u || id === currentUser().id) return;
      const nextActive = u.active === false; // pasa a lo contrario de lo que tenía
      u.active = nextActive;
      toast(nextActive ? "Usuario activado" : "Usuario desactivado");
      renderRoute();
      if (supa) {
        const { error } = await supa.from("usuarios").update({ estado: nextActive ? "activo" : "inactivo" }).eq("id", id);
        if (error) { u.active = !nextActive; supaToast(error, "No se pudo actualizar el estado del usuario en el servidor."); renderRoute(); }
      }
    });
  });
}

    } catch (err) {
      console.error(err);
      errEl.textContent = err?.message || "No se pudo actualizar la contraseña. Intenta de nuevo.";
      errEl.style.display = "block";
    } finally {
      submitBtn.disabled = false; savingEl.style.display = "none";
    }
  });
}

/* ============================================================
   MOTOR DE RENDER
   ============================================================ */
let _lastRouteParts = null;
function renderContentInPlace(html) { const main = $(".main"); if (main) { const rest = main.innerHTML.split('<div class="demo-banner"')[0]; main.querySelectorAll(":scope > *:not(.mobile-topbar):not(.demo-banner)").forEach((n) => n.remove()); main.insertAdjacentHTML("beforeend", html); } }
function renderRoute() { render(); }

function render() {
  const { path, parts, query } = currentRoute();
  if (!session) { if (path !== "/login") { location.hash = "#/login"; return; } document.getElementById("app").innerHTML = viewLogin(); attachLoginEvents(); return; }
  if (path === "/login") { location.hash = "#/dashboard"; return; }

  /* Enlaces de "ir al detalle" del dashboard: aplican el filtro una sola vez y limpian la query
     de la URL (con replaceState, sin disparar hashchange) para no pisar filtros que el usuario cambie después. */
  if (Object.keys(query).length) {
    if (parts[0] === "ventas" && !parts[1]) { if (query.line) ventasFilters.line = query.line; if (query.period) ventasFilters.period = query.period; }
    if (parts[0] === "rechazos") { if (query.line) rechazosFilters.line = query.line; if (query.period) rechazosFilters.period = query.period; if (query.q) rechazosFilters.q = query.q; }
    if (parts[0] === "clientes" && query.q) clientesFilters.q = query.q;
    history.replaceState(null, "", "#/" + parts.join("/"));
  }

  let content = "", attach = null, active = "#/" + parts[0];
  if (parts[0] === "dashboard") { content = viewDashboard(); attach = attachDashboardEvents; }
  else if (parts[0] === "ventas" && parts[1] === "nueva") { content = viewNuevaVenta(); attach = attachNuevaVentaEvents; }
  else if (parts[0] === "ventas" && parts[1]) { content = viewVentaDetalle(parts[1], {}); attach = () => attachVentaDetalleEvents(parts[1]); }
  else if (parts[0] === "ventas") { content = viewVentas(); attach = attachVentasEvents; }
  else if (parts[0] === "rechazos") { content = viewRechazos(); attach = attachRechazosEvents; }
  else if (parts[0] === "clientes") { content = viewClientes(); attach = attachClientesEvents; }
  else if (parts[0] === "cuotas") { content = viewCuotas(); attach = attachCuotasEvents; }
  else if (parts[0] === "reportes") { content = viewReportes(); attach = attachReportesEvents; }
  else if (parts[0] === "usuarios") {
    // Módulo exclusivo del administrador — si un vendedor entra por URL directa, se lo redirige.
    if (currentUser().role !== "admin") { location.hash = "#/dashboard"; return; }
    content = viewUsuarios(); attach = attachUsuariosEvents;
  }
  else if (parts[0] === "mi-cuenta") { content = viewMiCuenta(); attach = attachMiCuentaEvents; active = "#/mi-cuenta"; }
  else { location.hash = "#/dashboard"; return; }

  /* Preservar foco + posición del cursor a través del repintado completo: los buscadores con
     filtrado en vivo (Ventas/Rechazos/Clientes) llaman a este mismo render() en cada tecla, y como
     reemplaza TODO el HTML de #app, sin esto el usuario perdía el foco tras cada letra y solo podía
     escribir de a un carácter por vez. */
  const prevActive = document.activeElement;
  const prevId = prevActive && prevActive.id;
  const hasSelection = prevActive && "selectionStart" in prevActive;
  const prevSelStart = hasSelection ? prevActive.selectionStart : null;
  const prevSelEnd = hasSelection ? prevActive.selectionEnd : null;

  document.getElementById("app").innerHTML = shell(active, content);
  attachShellEvents();
  attach?.();

  if (prevId) {
    const el = document.getElementById(prevId);
    if (el && typeof el.focus === "function") {
      el.focus();
      if (prevSelStart !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(prevSelStart, prevSelEnd); } catch (err) { /* tipos sin selección (number, date) — ignorar */ }
      }
    }
  }
}

render();
</script>
