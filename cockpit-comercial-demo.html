          <label class="check-row"><input type="checkbox" id="wd-sundays" ${cfg.countSundays ? "checked" : ""}> Los domingos cuentan como día hábil</label>
        </div>
        <div id="wd-calendar-wrap">${workdaysCalendarHtml(2026, 8, cfg, TODAY_ISO)}</div>
        <div class="workdays-summary">
          <div class="wd-cell"><div class="lbl">Días hábiles del mes</div><div class="val" id="wd-total">${wd.totalHabiles}</div></div>
          <div class="wd-cell"><div class="lbl">Ya transcurridos</div><div class="val" id="wd-elapsed">${wd.elapsedHabiles}</div></div>
          <div class="wd-cell"><div class="lbl">Restantes</div><div class="val" id="wd-remaining">${wd.remainingHabiles}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px;"><button type="submit" class="btn btn-purple">Guardar configuración</button><span id="wd-saved" style="display:none;font-size:12px;font-weight:700;color:var(--green);">${icon("checkCircle",13)} Guardado</span></div>
      </form>
    </div>

    <div class="card" style="max-width:560px;">
      <form id="quota-form">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-mut);margin-bottom:4px;">Agosto 2026</div>
        <p style="font-size:12px;color:var(--text-mut);margin:0 0 14px;">No siempre te indican la cuota a inicio de mes — puedes dejarla en 0 y actualizarla apenas te la confirmen; Inicio se recalcula al instante.</p>
        ${LINES.map((l) => { const q = DB.quotas.find((qq) => qq.sellerId === sellerId && qq.year === 2026 && qq.month === 8 && qq.lineId === l.id);
          return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;"><span style="width:130px;font-size:13px;font-weight:600;">${l.name}</span><span style="font-size:13px;color:var(--text-mut);">S/</span>
          <input class="quota-amount" data-line="${l.id}" type="number" min="0" step="0.01" value="${q ? q.amount : ""}" placeholder="0.00" style="flex:1;padding:10px 13px;border-radius:11px;border:1.5px solid var(--border);background:#FBFBFE;font-family:inherit;">
          <span class="quota-updated">${q?.updatedAt ? `Act. ${fdate(q.updatedAt)}` : "Sin confirmar"}</span></div>`; }).join("")}
        <div class="total-bar" style="border-top:1px solid var(--border);"><span>Cuota total del mes</span><span class="amount" id="quota-total">S/ 0.00</span></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px;"><button type="submit" class="btn btn-purple">Guardar cuota</button><span id="quota-saved" style="display:none;font-size:12px;font-weight:700;color:var(--green);">${icon("checkCircle",13)} Cuota guardada</span></div>
      </form>
    </div>`;
}
function attachDashboardEvents() { attachRingEvents(".cump-ring"); }
function attachCuotasEvents() {
  const user = currentUser();
  const sellerId = user.role === "vendedor" ? user.sellerId : DB.sellers[0]?.id;

  // ---- Cuota por línea ----
  const totalEl = $("#quota-total");
  function refreshTotal() { totalEl.textContent = currency($$(".quota-amount").reduce((s, i) => s + (parseFloat(i.value) || 0), 0)); }
  $$(".quota-amount").forEach((i) => i.addEventListener("input", refreshTotal)); refreshTotal();
  $("#quota-form").addEventListener("submit", (e) => {
    e.preventDefault();
    $$(".quota-amount").forEach((input) => {
      const lineId = input.dataset.line, amount = parseFloat(input.value) || 0;
      const existing = DB.quotas.find((q) => q.sellerId === sellerId && q.year === 2026 && q.month === 8 && q.lineId === lineId);
      if (existing) { existing.amount = amount; existing.updatedAt = TODAY_ISO; }
      else DB.quotas.push({ id: `q-${Date.now()}-${lineId}`, sellerId, year: 2026, month: 8, lineId, amount, updatedAt: TODAY_ISO });
    });
    $("#quota-saved").style.display = "inline"; toast("Cuota guardada");
    setTimeout(() => $("#quota-saved")?.style && ($("#quota-saved").style.display = "none"), 2000);
    renderRoute();
  });

  // ---- Calendario de días hábiles — clic para marcar/desmarcar feriado, recalcula en vivo ----
  const cfg0 = getWorkConfig(sellerId, 2026, 8);
  const workCfg = { sellerId, year: 2026, month: 8, countSaturdays: cfg0.countSaturdays, countSundays: cfg0.countSundays, holidays: [...cfg0.holidays] };
  function refreshCalendar() {
    $("#wd-calendar-wrap").innerHTML = workdaysCalendarHtml(2026, 8, workCfg, TODAY_ISO);
    bindCalendarClicks();
    const wd = computeBusinessDays(2026, 8, workCfg.countSaturdays, workCfg.holidays, TODAY_ISO, workCfg.countSundays);
    $("#wd-total").textContent = wd.totalHabiles;
    $("#wd-elapsed").textContent = wd.elapsedHabiles;
    $("#wd-remaining").textContent = wd.remainingHabiles;
  }
  function bindCalendarClicks() {
    $$(".wd-day[data-clickable='1']").forEach((cell) => {
      cell.addEventListener("click", () => {
        const iso = cell.dataset.iso;
        const idx = workCfg.holidays.indexOf(iso);
        if (idx >= 0) workCfg.holidays.splice(idx, 1); else workCfg.holidays.push(iso);
        refreshCalendar();
      });
    });
  }
  bindCalendarClicks();
  $("#wd-saturdays").addEventListener("change", (e) => { workCfg.countSaturdays = e.target.checked; refreshCalendar(); });
  $("#wd-sundays").addEventListener("change", (e) => { workCfg.countSundays = e.target.checked; refreshCalendar(); });
  $("#workdays-form").addEventListener("submit", (e) => {
    e.preventDefault();
    saveWorkConfig(workCfg);
    $("#wd-saved").style.display = "inline"; toast("Configuración de días hábiles guardada");
    setTimeout(() => $("#wd-saved")?.style && ($("#wd-saved").style.display = "none"), 2000);
  });
}

/* ============================================================
   VISTA: REPORTES
   ============================================================ */
function viewReportes() {
  return `
    <h1 class="page-title" style="margin-bottom:4px;">Reportes</h1>
    <p class="page-sub" style="margin-bottom:18px;">Exporta tus ventas y rechazos, o importa una cartera de clientes desde CSV. Disponible para vendedores y administradores.</p>
    <div class="card"><h2 style="font-size:13px;font-weight:700;margin:0 0 12px;">Exportar</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <button id="exp-ventas" class="btn btn-outline btn-sm">Ventas · CSV (Excel)</button>
        <button id="exp-rechazos" class="btn btn-outline btn-sm">Rechazos · CSV (Excel)</button>
      </div>
    </div>
    <div class="card"><h2 style="font-size:13px;font-weight:700;margin:0 0 6px;">Importar clientes desde CSV</h2>
      <p style="font-size:12px;color:var(--text-mut);margin:0 0 14px;">Columnas esperadas: Razón Social, Nombre Comercial, RUC, Teléfono. Se muestra vista previa con validación antes de importar.</p>
      <input id="import-file" type="file" accept=".csv" style="font-size:13px;">
      <div id="import-preview" style="margin-top:16px;"></div>
    </div>`;
}
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length);
  if (!lines.length) return [];
  const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, ""));
  return lines.slice(1).map((line) => { const cells = line.split(",").map((c) => c.trim().replace(/^"|"$/g, "")); const obj = {}; headers.forEach((h, i) => (obj[h] = cells[i] ?? "")); return obj; });
}
function attachReportesEvents() {
  $("#exp-ventas").addEventListener("click", () => exportVentasExcel(scopedSales(currentUser())));
  $("#exp-rechazos").addEventListener("click", () => exportRechazosExcel(rechazosRows(currentUser())));
  $("#import-file").addEventListener("change", (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(String(ev.target.result));
      const existingRucs = new Set(DB.clients.map((c) => c.ruc)); const seen = new Set();
      const parsed = rows.map((r) => {
        const businessName = (r["Razón Social"] || r["Razon Social"] || r["businessName"] || "").trim();
        const tradeName = (r["Nombre Comercial"] || r["tradeName"] || "").trim();
        const ruc = (r["RUC"] || r["ruc"] || "").trim(); const phone = (r["Teléfono"] || r["phone"] || "").trim();
        const errors = [];
        if (!businessName) errors.push("Falta razón social"); if (!ruc) errors.push("Falta RUC");
        if (ruc && existingRucs.has(ruc)) errors.push("Cliente ya existe (RUC duplicado)");
        if (ruc && seen.has(ruc)) errors.push("Duplicado en el archivo"); if (ruc) seen.add(ruc);
        return { businessName, tradeName, ruc, phone, errors };
      });
      renderImportPreview(parsed);
    };
    reader.readAsText(file);
  });
}
let _importPreview = null;
function renderImportPreview(rows) {
  _importPreview = rows;
  $("#import-preview").innerHTML = `
    <div class="table-scroll"><table><thead><tr><th>Razón social</th><th>RUC</th><th>Teléfono</th><th>Estado</th></tr></thead>
    <tbody>${rows.map((r) => `<tr><td>${esc(r.businessName) || "—"}</td><td>${esc(r.ruc) || "—"}</td><td>${esc(r.phone) || "—"}</td>
      <td>${r.errors.length === 0 ? `<span class="badge green">Lista para importar</span>` : `<span class="badge red">${esc(r.errors.join(" · "))}</span>`}</td></tr>`).join("")}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="import-confirm" class="btn btn-purple" ${rows.every((r) => r.errors.length > 0) ? "disabled" : ""}>Confirmar importación (${rows.filter((r) => r.errors.length === 0).length} de ${rows.length})</button>
      <button id="import-cancel" class="btn btn-outline">Cancelar</button>
    </div>`;
  $("#import-confirm")?.addEventListener("click", () => {
    const user = currentUser(); let count = 0;
    _importPreview.filter((r) => r.errors.length === 0).forEach((r) => {
      DB.clients.unshift({ id: `c-${Date.now()}-${count}`, code: `CLI-${String(DB.clients.length + 1).padStart(3, "0")}`, businessName: r.businessName, tradeName: r.tradeName || r.businessName, ruc: r.ruc, phone: r.phone, sellerId: user.sellerId || user.id, branches: [] });
      count++;
    });
    $("#import-preview").innerHTML = `<div class="form-success">Se importaron ${count} cliente(s) correctamente (solo en esta demo). Recuerda agregarles sucursales desde el módulo Clientes.</div>`;
    $("#import-file").value = "";
  });
  $("#import-cancel")?.addEventListener("click", () => { $("#import-preview").innerHTML = ""; $("#import-file").value = ""; });
}

/* ============================================================
   MOTOR DE RENDER
   ============================================================ */
let _lastRouteParts = null;
function renderContentInPlace(html) { const main = $(".main"); if (main) { const rest = main.innerHTML.split('<div class="demo-banner"')[0]; main.querySelectorAll(":scope > *:not(.mobile-topbar):not(.demo-banner)").forEach((n) => n.remove()); main.insertAdjacentHTML("beforeend", html); } }
function renderRoute() { render(); }

function render() {
  const { path, parts, query } = currentRoute();
  if (!session) { if (path !== "/login") { location.hash = "#/login"; return; } document.getElementById("app").innerHTML = viewLogin(); attachLoginEvents(); return; }
  if (path === "/login") { location.hash = "#/dashboard"; return; }

  /* Enlaces de "ir al detalle" del dashboard: aplican el filtro una sola vez y limpian la query
     de la URL (con replaceState, sin disparar hashchange) para no pisar filtros que el usuario cambie después. */
  if (Object.keys(query).length) {
    if (parts[0] === "ventas" && !parts[1]) { if (query.line) ventasFilters.line = query.line; if (query.period) ventasFilters.period = query.period; }
    if (parts[0] === "rechazos") { if (query.line) rechazosFilters.line = query.line; if (query.period) rechazosFilters.period = query.period; if (query.q) rechazosFilters.q = query.q; }
    if (parts[0] === "clientes" && query.q) clientesFilters.q = query.q;
    history.replaceState(null, "", "#/" + parts.join("/"));
  }

  let content = "", attach = null, active = "#/" + parts[0];
  if (parts[0] === "dashboard") { content = viewDashboard(); attach = attachDashboardEvents; }
  else if (parts[0] === "ventas" && parts[1] === "nueva") { content = viewNuevaVenta(); attach = attachNuevaVentaEvents; }
  else if (parts[0] === "ventas" && parts[1]) { content = viewVentaDetalle(parts[1], {}); attach = () => attachVentaDetalleEvents(parts[1]); }
  else if (parts[0] === "ventas") { content = viewVentas(); attach = attachVentasEvents; }
  else if (parts[0] === "rechazos") { content = viewRechazos(); attach = attachRechazosEvents; }
  else if (parts[0] === "clientes") { content = viewClientes(); attach = attachClientesEvents; }
  else if (parts[0] === "cuotas") { content = viewCuotas(); attach = attachCuotasEvents; }
  else if (parts[0] === "reportes") { content = viewReportes(); attach = attachReportesEvents; }
  else { location.hash = "#/dashboard"; return; }

  /* Preservar foco + posición del cursor a través del repintado completo: los buscadores con
     filtrado en vivo (Ventas/Rechazos/Clientes) llaman a este mismo render() en cada tecla, y como
     reemplaza TODO el HTML de #app, sin esto el usuario perdía el foco tras cada letra y solo podía
     escribir de a un carácter por vez. */
  const prevActive = document.activeElement;
  const prevId = prevActive && prevActive.id;
  const hasSelection = prevActive && "selectionStart" in prevActive;
  const prevSelStart = hasSelection ? prevActive.selectionStart : null;
  const prevSelEnd = hasSelection ? prevActive.selectionEnd : null;

  document.getElementById("app").innerHTML = shell(active, content);
  attachShellEvents();
  attach?.();

  if (prevId) {
    const el = document.getElementById(prevId);
    if (el && typeof el.focus === "function") {
      el.focus();
      if (prevSelStart !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(prevSelStart, prevSelEnd); } catch (err) { /* tipos sin selección (number, date) — ignorar */ }
      }
    }
  }
}

render();
</script>
